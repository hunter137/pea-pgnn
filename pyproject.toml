[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pea-pgnn"
version = "0.1.0"
description = "Prior-anchored, structure-preserving neural prediction for time-dependent engineering responses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "torch>=2.0",
]
keywords = [
    "knowledge-guided learning",
    "physics-guided neural network",
    "temporal extrapolation",
    "concrete shrinkage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/hunter137/pea-pgnn"
Repository = "https://github.com/hunter137/pea-pgnn"
Issues = "https://github.com/hunter137/pea-pgnn/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Keep annotations importable on the oldest supported Python release.
    "UP007",
    "UP045",
]
