name: Bug report
description: Report reproducible incorrect or unexpected package behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach restricted research data or untrusted model files.
  - type: input
    id: version
    attributes:
      label: PEA-PGNN version or commit
      placeholder: "0.1.1 or git commit"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include the smallest self-contained code and synthetic inputs that reproduce the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, NumPy, scikit-learn, PyTorch, CPU/GPU, and installation method.
      render: text
    validations:
      required: true
  - type: textarea
    id: scientific_context
    attributes:
      label: Units and scientific context
      description: For prior or trajectory issues, list units, time convention, shapes, and relevant assumptions.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report contains no credentials, private correspondence, or restricted data.
          required: true

